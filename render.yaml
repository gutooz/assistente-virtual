services:
  - type: worker
    name: assistente-guto
    env: python
    plan: free
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: python -m bot.main
    envVars:
      - key: DATABASE_PATH
        value: assistant.db
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RTSP_URL
        sync: false
      - key: GOOGLE_API_KEY
        value: ""
